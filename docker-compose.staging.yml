version: '3.8'

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: "/api"
        VITE_WHATSAPP_API_URL: ""
        VITE_APP_ENV: "staging"
    container_name: pos_frontend_staging
    ports:
      - "8080:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
    networks:
      - pos_network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  pos_network:
    external: true
